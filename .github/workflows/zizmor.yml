name: GitHub Actions Security Analysis

# Audits the workflows with zizmor. Findings are uploaded to the repository's
# Security tab (code scanning) instead of failing the job.
on:
    push:
        branches: [dev]
    pull_request:
        branches: ["**"]

permissions: {}

jobs:
    zizmor:
        runs-on: ubuntu-slim
        permissions:
            security-events: write # upload the SARIF results to code scanning

        steps:
            - name: Check out repository code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Run zizmor
              uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
