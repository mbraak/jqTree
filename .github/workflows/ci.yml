name: Continuous integration

on: [push]

jobs:
    runner-job:
        runs-on: ubuntu-latest

        env:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

        steps:
            - name: Check out repository code
              uses: actions/checkout@v7
            - name: Setup node
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
            - name: Install pnpm
              run: npm install -g pnpm
            - name: Get pnpm store directory
              id: pnpm-cache
              run: |
                  echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
            - uses: actions/cache@v6
              name: Setup pnpm cache
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-
            - uses: actions/cache@v6
              name: Setup Playwright browsers cache
              with:
                  path: /home/runner/.cache/ms-playwright/
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-playwright-
            - name: Install packages
              run: |
                  pnpm install
            - name: Build
              run: |
                  pnpm run production
            - name: Lint
              run: |
                  pnpm run lint
            - name: Check types
              run: |
                  pnpm run tsc
            - name: Clean coverage
              run: rm -rf .nyc_output && rm -rf node_modules/.vite
            - name: Run vitest tests
              run: pnpm run vitest
            - name: Playwright install
              run: npx playwright install chromium
            - name: Copy vendor files
              run: pnpm install && pnpm run copy_vendor_files
              working-directory: ./docs
            - name: Run playwright tests
              run: pnpm run playwright
            - name: Screenshots artifact
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  if-no-files-found: ignore
                  name: screenshots
                  path: test-results/
            - name: Merge coverage
              run: cp js-coverage/coverage-final.json .nyc_output/coverage_jsdom.json
            - name: Codecov
              uses: codecov/codecov-action@v7
              with:
                  directory: .nyc_output
                  verbose: true
